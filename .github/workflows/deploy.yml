name: Deploy Flask to PythonAnywhere

on:
  push:
    branches:
      - main

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Deploy staging
        env:
          PA_USERNAME: ${{ secrets.PA_USERNAME }}
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
        run: |
          curl -X POST \
            "https://www.pythonanywhere.com/api/v0/user/$PA_USERNAME/consoles/" \
            -H "Authorization: Token $PA_API_TOKEN" \
            --data-urlencode "executable=bash" \
            --data-urlencode "arguments=/home/$PA_USERNAME/deploy_staging.sh"

      - name: Reload staging
        uses: jensvog/pythonanywhere-webapp-reload-action@v1
        with:
          username: ${{ secrets.PA_USERNAME }}
          api-token: ${{ secrets.PA_API_TOKEN }}
          domain-name: ${{ secrets.PA_STAGING_DOMAIN }}

  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production

    steps:
      - name: Deploy production
        env:
          PA_USERNAME: ${{ secrets.PA_USERNAME }}
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
        run: |
          curl -X POST \
            "https://www.pythonanywhere.com/api/v0/user/$PA_USERNAME/consoles/" \
            -H "Authorization: Token $PA_API_TOKEN" \
            --data-urlencode "executable=bash" \
            --data-urlencode "arguments=/home/$PA_USERNAME/deploy_prod.sh"

      - name: Reload production
        uses: jensvog/pythonanywhere-webapp-reload-action@v1
        with:
          username: ${{ secrets.PA_USERNAME }}
          api-token: ${{ secrets.PA_API_TOKEN }}
          domain-name: ${{ secrets.PA_PROD_DOMAIN }}
