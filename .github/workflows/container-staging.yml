name: Container staging
on:
  pull_request:
  push:
    branches: [staging]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: container-staging-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: flask
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: flask
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flask -d flask"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.lock -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Validate Azure infrastructure
        run: az bicep build --file infra/staging.bicep --outfile /tmp/staging-arm.json
      - name: Verify PostgreSQL migrations and contracts
        env:
          FLASK_CONFIG: production
          CONTAINER_MODE: "true"
          SECRET_KEY: ci-only-secret
          ADMIN_API_TOKEN: ci-only-token
          DATABASE_URL: postgresql+psycopg://flask:test-password@localhost:5432/flask
        run: |
          flask --app wsgi db upgrade
          flask --app wsgi db check
          python -m scripts.container_smoke
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: flask-portfolio:ci
      - name: Smoke test built image
        run: |
          docker run --detach --network host --name portfolio-ci -e SECRET_KEY=ci-only-secret -e ADMIN_API_TOKEN=ci-only-token -e DATABASE_URL=postgresql+psycopg://flask:test-password@localhost:5432/flask flask-portfolio:ci
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:8080/health/ready; then exit 0; fi
            sleep 2
          done
          docker logs portfolio-ci
          exit 1
  azure:
    needs: quality
    if: github.ref == 'refs/heads/staging' && vars.AZURE_CONTAINER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
      MIGRATION_JOB: ${{ vars.AZURE_MIGRATION_JOB_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Build and publish immutable image
        run: |
          az acr build --registry "$ACR_NAME" --image "portfolio:${GITHUB_SHA}" .
          login_server=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
          echo "IMAGE=${login_server}/portfolio:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Apply migrations once before updating web instances
        run: |
          az containerapp job update --name "$MIGRATION_JOB" --resource-group "$RESOURCE_GROUP" --image "$IMAGE"
          execution=$(az containerapp job start --name "$MIGRATION_JOB" --resource-group "$RESOURCE_GROUP" --query name -o tsv)
          for attempt in $(seq 1 90); do
            status=$(az containerapp job execution show --name "$MIGRATION_JOB" --resource-group "$RESOURCE_GROUP" --job-execution-name "$execution" --query properties.status -o tsv)
            case "$status" in
              Succeeded) exit 0 ;;
              Failed|Stopped) echo "Migration job failed: $status"; exit 1 ;;
            esac
            sleep 10
          done
          echo "Migration job timed out"
          exit 1
      - name: Deploy staging revision and check readiness
        run: |
          az containerapp update --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --image "$IMAGE"
          fqdn=$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          curl --fail --retry 10 --retry-all-errors --retry-delay 5 "https://${fqdn}/health/ready"
