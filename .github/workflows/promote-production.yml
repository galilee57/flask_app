name: Promote validated release to PythonAnywhere production
on:
  workflow_dispatch:
    inputs:
      inspect_only:
        description: Inspect configuration without changing the application
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: pythonanywhere-production
  cancel-in-progress: false
jobs:
  quality:
    name: Python quality gate
    runs-on: ubuntu-latest
    env:
      FLASK_CONFIG: testing

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-python310.lock -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall app tests

      - name: Run test suite
        run: python -m pytest -q

      - name: Require exactly one Alembic migration head
        shell: bash
        run: |
          set -euo pipefail
          migration_output="$(python -m flask --app wsgi db heads)"
          printf '%s\n' "${migration_output}"
          head_count="$(awk '/^[0-9a-f]+ \(head\)$/ { count++ } END { print count + 0 }' <<<"${migration_output}")"

          if [[ "${head_count}" -ne 1 ]]; then
            echo "Expected exactly one Alembic migration head; found ${head_count}." >&2
            exit 1
          fi

  production:
    needs: quality
    runs-on: ubuntu-latest
    environment: staging
    env:
      PA_USERNAME: ${{ secrets.PA_USERNAME }}
      PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}
      PA_SSH_PRIVATE_KEY: ${{ secrets.PA_SSH_PRIVATE_KEY }}
      STAGING_DOMAIN: ${{ secrets.PA_STAGING_DOMAIN }}
      DOMAIN: Galilee57.pythonanywhere.com
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve application directories
        shell: bash
        run: |
          set -euo pipefail
          for target in production staging; do
            domain="$DOMAIN"
            if [ "$target" = staging ]; then domain="$STAGING_DOMAIN"; fi
            curl -fsS "https://www.pythonanywhere.com/api/v0/user/${PA_USERNAME}/webapps/${domain}/" -H "Authorization: Token ${PA_API_TOKEN}" > "$RUNNER_TEMP/$target.json"
          done
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          prod = json.loads(Path(os.environ['RUNNER_TEMP'], 'production.json').read_text())
          stage = json.loads(Path(os.environ['RUNNER_TEMP'], 'staging.json').read_text())
          assert prod['source_directory'] != stage['source_directory'], 'Production and staging must have separate checkouts'
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              for name, value in [('APP_DIR',prod['source_directory']),('STAGE_DIR',stage['source_directory']),('VIRTUALENV_DIR',prod['virtualenv_path']),('STAGE_VENV',stage['virtualenv_path'])]:
                  assert value and '\n' not in value
                  f.write(f'{name}={value}\n')
          print('Production Python:', prod.get('python_version'))
          print('Production source:', prod['source_directory'])
          print('Production virtualenv:', prod['virtualenv_path'])
          print('WSGI path:', prod.get('wsgi_configuration_file'))
          print('Staging source:',stage['source_directory'])
          PYTHON
      - name: Configure existing deployment credentials
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PA_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ssh.pythonanywhere.com >> ~/.ssh/known_hosts
      - name: Inspect production and staging
        shell: bash
        run: |
          set -euo pipefail
          remote_env="APP_DIR=$(printf '%q' "$APP_DIR") STAGE_DIR=$(printf '%q' "$STAGE_DIR") STAGE_VENV=$(printf '%q' "$STAGE_VENV")"
          ssh -o BatchMode=yes "$PA_USERNAME@ssh.pythonanywhere.com" "$remote_env bash -s" <<'REMOTE'
          set -euo pipefail
          for directory in "$APP_DIR" "$STAGE_DIR"; do
            cd "$directory"
            pwd
            git log -1 --format='%h %s'
            git status --short
          done
          "$STAGE_VENV/bin/python" - <<'PYTHON'
          import os
          from pathlib import Path
          from dotenv import dotenv_values
          prod=dotenv_values(Path(os.environ['APP_DIR'])/'.env')
          stage=dotenv_values(Path(os.environ['STAGE_DIR'])/'.env')
          for name in ['FLASK_CONFIG','SECRET_KEY','ADMIN_API_TOKEN','DATABASE_URL']:
              print(name, 'production present:',bool(prod.get(name)), 'staging present:',bool(stage.get(name)), 'same:',prod.get(name)==stage.get(name))
          print('Production uses PostgreSQL:', str(prod.get('DATABASE_URL','')).startswith(('postgres','postgresql')))
          print('Staging uses PostgreSQL:', str(stage.get('DATABASE_URL','')).startswith(('postgres','postgresql')))
          PYTHON
          REMOTE
      - name: Promote pinned release and preserve production files
        if: ${{ !inputs.inspect_only }}
        shell: bash
        run: |
          set -euo pipefail
          remote_env="APP_DIR=$(printf '%q' "$APP_DIR") STAGE_DIR=$(printf '%q' "$STAGE_DIR") VIRTUALENV_DIR=$(printf '%q' "$VIRTUALENV_DIR") STAGE_VENV=$(printf '%q' "$STAGE_VENV") RELEASE_SHA=$(printf '%q' "$RELEASE_SHA")"
          ssh -o BatchMode=yes "$PA_USERNAME@ssh.pythonanywhere.com" "$remote_env bash -s" <<'REMOTE'
          set -euo pipefail
          umask 077
          cd "$APP_DIR"
          backup_dir="$HOME/deployment-backups/production-$(date -u +%Y%m%dT%H%M%SZ)"
          mkdir -p "$backup_dir"
          export BACKUP_DIR="$backup_dir"
          git rev-parse HEAD > "$backup_dir/previous-commit"
          cp -p .env "$backup_dir/production.env"
          cp -p .env "$backup_dir/prepared.env"
          wsgi_file=/var/www/galilee57_pythonanywhere_com_wsgi.py
          test -f "$wsgi_file"
          cp -p "$wsgi_file" "$backup_dir/application_wsgi.py"
          tar --exclude=.git --exclude=__pycache__ --exclude=.venv -czf "$backup_dir/source.tar.gz" .
          "$STAGE_VENV/bin/python" - <<'PYTHON'
          import os
          from pathlib import Path
          from dotenv import dotenv_values, set_key
          env=Path(os.environ['BACKUP_DIR'])/'prepared.env'
          prod=dotenv_values(env)
          stage=dotenv_values(Path(os.environ['STAGE_DIR'])/'.env')
          assert prod.get('DATABASE_URL') == stage.get('DATABASE_URL'), 'Database configuration changed since inspection'
          assert stage.get('ADMIN_API_TOKEN'), 'Staging token missing'
          if not prod.get('ADMIN_API_TOKEN'):
              set_key(env, 'ADMIN_API_TOKEN', stage['ADMIN_API_TOKEN'])
          values=dotenv_values(env)
          assert values.get('FLASK_CONFIG') == 'production'
          assert all(values.get(key) for key in ('SECRET_KEY','ADMIN_API_TOKEN','DATABASE_URL'))
          PYTHON
          git fetch origin main staging
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          test "$(git -C "$STAGE_DIR" rev-parse HEAD)" = "$RELEASE_SHA"
          if ! git diff --quiet || ! git diff --cached --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            git stash push --include-untracked --message "pre-production-promotion-$(date -u +%Y%m%dT%H%M%SZ)"
          fi
          git switch --detach "$RELEASE_SHA"
          cp "$backup_dir/prepared.env" .env
          chmod 600 .env
          "$VIRTUALENV_DIR/bin/pip" install --disable-pip-version-check -r requirements-python310.lock
          # Production and staging share the already migrated database. Verify without changing it.
          "$VIRTUALENV_DIR/bin/python" - <<'PYTHON'
          from app import create_app
          from app.extensions import db
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          from sqlalchemy import text
          app=create_app('production')
          with app.app_context():
              config=Config('migrations/alembic.ini')
              config.set_main_option('script_location', 'migrations')
              expected=set(ScriptDirectory.from_config(config).get_heads())
              actual=set(db.session.execute(text('SELECT version_num FROM alembic_version')).scalars())
              assert actual == expected, 'Database revision must match the validated release'
          client=app.test_client()
          assert client.get('/health/ready').status_code == 200
          response=client.get('/projects/tetris/')
          assert response.status_code == 200 and b'ai-inspector' in response.data
          PYTHON
          "$VIRTUALENV_DIR/bin/python" - <<'PYTHON'
          import os
          from pathlib import Path
          target=Path('/var/www/galilee57_pythonanywhere_com_wsgi.py')
          source='import os\nimport sys\nsys.path.insert(0, '+repr(os.environ['APP_DIR'])+')\nos.environ["FLASK_CONFIG"] = "production"\nfrom wsgi import application\n'
          target.write_text(source)
          PYTHON
          printf 'Production release: %s\nBackup directory: %s\n' "$RELEASE_SHA" "$backup_dir"
          REMOTE
      - name: Reload main application
        if: ${{ !inputs.inspect_only }}
        run: |
          curl -fsS --request POST "https://www.pythonanywhere.com/api/v0/user/${PA_USERNAME}/webapps/${DOMAIN}/reload/" -H "Authorization: Token ${PA_API_TOKEN}"
      - name: Verify main application
        if: ${{ !inputs.inspect_only }}
        run: |
          set -euo pipefail
          curl --retry 6 --retry-delay 5 --retry-all-errors -fsS "https://${DOMAIN}/health/ready"
          curl -fsS "https://${DOMAIN}/projects/tetris/" -o "$RUNNER_TEMP/tetris.html"
          grep -q 'ai-inspector' "$RUNNER_TEMP/tetris.html"
