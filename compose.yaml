x-app: &app
  image: flask-portfolio:local
  build: .
  environment:
    SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
    ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?Set ADMIN_API_TOKEN in .env}
    DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL in .env (Mac PostgreSQL via host.docker.internal)}

services:
  migrate:
    <<: *app
    command: ["flask", "--app", "wsgi", "db", "upgrade"]
  web:
    <<: *app
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
