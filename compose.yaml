x-app: &app
  image: flask-portfolio:local
  build: .
  environment:
    SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
    ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?Set ADMIN_API_TOKEN in .env}
    DATABASE_URL: postgresql+psycopg://flask:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/flask
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flask
      POSTGRES_USER: flask
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flask -d flask"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *app
    command: ["flask", "--app", "wsgi", "db", "upgrade"]
  web:
    <<: *app
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  database:
